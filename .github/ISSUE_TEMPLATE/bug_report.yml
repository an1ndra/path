name: Bug report
description: Something behaves differently than the README says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys, `sk-gw-` tokens and any
        prompt content from logs before pasting them here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the request (redacted) and the response.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the gateway with ...
        2. POST /v1/chat/completions with ...
        3. See error ...
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - OpenAI
        - Anthropic
        - Groq
        - Other OpenAI-compatible
        - Not provider-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit SHA
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed all credentials and prompt content from this report
          required: true
        - label: I searched existing issues for the same problem
          required: true
