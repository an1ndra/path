name: Provider canary

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: One tiny call per provider
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Skip when no provider secrets are configured
        id: gate
        run: |
          if [ -z "$OPENAI_API_KEY$ANTHROPIC_API_KEY$GROQ_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No provider secrets configured; skipping the canary."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the gateway
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ./mvnw -B -DskipTests package
          GATEWAY_ADMIN_TOKEN=canary java -jar target/path-*.jar > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health > /dev/null && break
            sleep 1
          done
          KEY=$(grep -o 'sk-gw-[A-Za-z0-9]*' /tmp/gateway.log | head -1)
          echo "PATH_KEY=$KEY" >> "$GITHUB_ENV"
          echo "KEY_OK=$([ -n "$KEY" ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Probe each provider
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -e
          failed=0
          check() {
            model="$1"
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' http://127.0.0.1:8080/v1/chat/completions \
              -H "Authorization: Bearer $PATH_KEY" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$model\",\"max_tokens\":8,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}")
            if [ "$code" != "200" ]; then
              echo "::error::canary failed for $model (HTTP $code): $(head -c 200 /tmp/out.json)"
              failed=1
            else
              echo "canary ok: $model"
            fi
          }
          [ -n "$OPENAI_API_KEY" ] && check gpt-4o-mini
          [ -n "$ANTHROPIC_API_KEY" ] && check claude-3.5-haiku
          [ -n "$GROQ_API_KEY" ] && check llama-3.3-70b
          exit $failed

      - name: Open an issue when the canary fails
        if: failure() && steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Provider canary failed on $(date -u +%Y-%m-%d)" \
            --body "The nightly canary could not complete a minimal call. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. This usually means a provider changed its API or a key was revoked."

      - name: Show gateway log on failure
        if: failure()
        run: tail -60 /tmp/gateway.log || true
