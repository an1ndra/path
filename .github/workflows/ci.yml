name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Run the gateway against the mock upstream
        run: |
          mkdir -p /tmp/opencode
          python3 tools/mock-upstream.py 9099 > /tmp/opencode/mock.log 2>&1 &
          GATEWAY_ADMIN_TOKEN=test-admin java -jar target/path-*.jar \
            > /tmp/opencode/gateway.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then
              echo "gateway up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/actuator/health
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/v1/models | grep -q 'gpt-4o-mini'; then
              echo "catalogue seeded after ${i}s"
              break
            fi
            sleep 1
          done
          python3 tools/smoke_test.py

      - name: Show gateway log on failure
        if: failure()
        run: tail -60 /tmp/opencode/gateway.log
