name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate the changelog is parseable
        run: python3 tools/changelog.py 0.1.0 > /dev/null

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  helm:
    name: Helm chart
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      - name: Lint
        run: helm lint deploy/helm/path --set existingSecret=path-credentials

      - name: Render every toggle
        run: |
          helm template path deploy/helm/path --set existingSecret=x > /dev/null
          helm template path deploy/helm/path --set existingSecret=x \
            --set autoscaling.enabled=true --set postgres.enabled=true \
            --set valkey.enabled=true --set serviceMonitor.enabled=true > /dev/null

      - name: No credentials are rendered inline
        run: |
          if helm template path deploy/helm/path --set existingSecret=x | grep -q "kind: Secret"; then
            echo "::error::The chart rendered a Secret while existingSecret was set"
            exit 1
          fi

      - name: The drain guard must fail closed
        run: |
          if helm template path deploy/helm/path --set existingSecret=x \
              --set drainTimeoutSeconds=60 --set terminationGracePeriodSeconds=30 > /dev/null 2>&1; then
            echo "::error::The chart rendered with a grace period below the drain timeout"
            exit 1
          fi

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Run the gateway against the mock upstream
        run: |
          mkdir -p /tmp/opencode
          python3 tools/mock-upstream.py 9099 > /tmp/opencode/mock.log 2>&1 &
          GATEWAY_ADMIN_TOKEN=test-admin java -jar target/path-*.jar \
            > /tmp/opencode/gateway.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then
              echo "gateway up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/actuator/health
          curl -sf http://127.0.0.1:8080/v3/api-docs -o /tmp/opencode/openapi.json
          test -s /tmp/opencode/openapi.json
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/v1/models | grep -q 'gpt-4o-mini'; then
              echo "catalogue seeded after ${i}s"
              break
            fi
            sleep 1
          done
          python3 tools/smoke_test.py

      - name: Upload OpenAPI spec
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi
          path: /tmp/opencode/openapi.json
          retention-days: 14

      - name: Show gateway log on failure
        if: failure()
        run: tail -60 /tmp/opencode/gateway.log
