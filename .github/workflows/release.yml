name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Scan, sign off and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar and SBOM
        run: ./mvnw -B -DskipTests package

      # --- supply chain: checksums -------------------------------------------
      - name: Collect SBOM
        run: cp target/classes/META-INF/sbom/application.cdx.json target/bom.json

      - name: Write SHA-256 checksums
        run: |
          cd target
          sha256sum path-*.jar bom.json | sort -k2 > checksums.txt
          ls -l path-*.jar bom.json checksums.txt
          cat checksums.txt

      - name: Verify the checksums we just wrote
        run: cd target && sha256sum -c checksums.txt

      # --- container: build, scan, push --------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Record the image digest
        run: |
          echo "### Container digest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- publish -----------------------------------------------------------
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 tools/changelog.py "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: |
            target/path-*.jar
            target/bom.json
            target/checksums.txt
          fail_on_unmatched_files: true
