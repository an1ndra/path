{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "path.fullname" . }}-valkey
  labels:
    {{- include "path.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "path.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "path.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          ports:
            - containerPort: 6379
              name: redis
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "path.fullname" . }}-valkey
  labels:
    {{- include "path.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  ports:
    - port: 6379
      targetPort: redis
  selector:
    {{- include "path.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
{{- end }}
