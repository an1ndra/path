spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aigateway}
    username: ${DB_USER:aigateway}
    password: ${DB_PASSWORD:aigateway}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
