server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: path
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gateway;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

gateway:
  # Empty means the admin API is disabled (403). Set GATEWAY_ADMIN_TOKEN to enable it.
  admin-token: ${GATEWAY_ADMIN_TOKEN:}
  # Allow GET /v1/models without an API key.
  public-models: ${GATEWAY_PUBLIC_MODELS:true}
  cors-origins: ${GATEWAY_CORS_ORIGINS:*}
  connect-timeout: 10s
  request-timeout: 180s
  stream-idle-timeout: 120s
  # 32-byte base64 key. When empty, a key is generated and stored at master-key-path.
  master-key: ${GATEWAY_MASTER_KEY:}
  master-key-path: ${GATEWAY_MASTER_KEY_PATH:./data/master.key}
  bootstrap-demo-key: ${GATEWAY_BOOTSTRAP_DEMO_KEY:true}
  default-rpm-limit: ${GATEWAY_DEFAULT_RPM:120}
  default-credit-limit-usd: ${GATEWAY_DEFAULT_CREDIT_USD:}
  breaker:
    failure-threshold: ${GATEWAY_BREAKER_FAILURES:5}
    open-duration: ${GATEWAY_BREAKER_OPEN:30s}
    max-attempts: ${GATEWAY_MAX_ATTEMPTS:3}
  idempotency:
    ttl: ${GATEWAY_IDEMPOTENCY_TTL:24h}
    max-response-bytes: ${GATEWAY_IDEMPOTENCY_MAX_BYTES:2097152}
  # Upstream credentials. A key stored through the admin API takes precedence.
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    groq:
      api-key: ${GROQ_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.anindra.path: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n"
