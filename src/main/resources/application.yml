server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: path
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gateway;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing pre-Flyway schema is marked as V1 instead of being recreated.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Store enums as varchar so one migration works on H2 and Postgres.
        type.preferred_enum_jdbc_type: STRING
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

gateway:
  # Empty means the admin API is disabled (403). Set GATEWAY_ADMIN_TOKEN to enable it.
  admin-token: ${GATEWAY_ADMIN_TOKEN:}
  # Allow GET /v1/models without an API key.
  public-models: ${GATEWAY_PUBLIC_MODELS:true}
  cors-origins: ${GATEWAY_CORS_ORIGINS:*}
  connect-timeout: 10s
  request-timeout: 180s
  stream-idle-timeout: 120s
  # 32-byte base64 key. When empty, a key is generated and stored at master-key-path.
  master-key: ${GATEWAY_MASTER_KEY:}
  master-key-path: ${GATEWAY_MASTER_KEY_PATH:./data/master.key}
  bootstrap-demo-key: ${GATEWAY_BOOTSTRAP_DEMO_KEY:false}
  default-rpm-limit: ${GATEWAY_DEFAULT_RPM:120}
  default-credit-limit-usd: ${GATEWAY_DEFAULT_CREDIT_USD:}
  default-max-concurrent: ${GATEWAY_DEFAULT_MAX_CONCURRENT:8}
  max-request-bytes: ${GATEWAY_MAX_REQUEST_BYTES:1048576}
  max-output-tokens: ${GATEWAY_MAX_OUTPUT_TOKENS:0}
  drain-timeout: ${GATEWAY_DRAIN_TIMEOUT:30s}
  breaker:
    failure-threshold: ${GATEWAY_BREAKER_FAILURES:5}
    open-duration: ${GATEWAY_BREAKER_OPEN:30s}
    max-attempts: ${GATEWAY_MAX_ATTEMPTS:3}
  cache:
    max-body-bytes: ${GATEWAY_CACHE_MAX_BYTES:2097152}
  admin-auth:
    max-failures: ${GATEWAY_ADMIN_AUTH_FAILURES:10}
    window: ${GATEWAY_ADMIN_AUTH_WINDOW:5m}
  rate-limit:
    backend: ${GATEWAY_RATE_LIMIT_BACKEND:memory}
    prefix: ${GATEWAY_RATE_LIMIT_PREFIX:path}
  prompt-logging:
    enabled: ${GATEWAY_PROMPT_LOGGING:false}
    retention: ${GATEWAY_PROMPT_LOG_RETENTION:7d}
    max-body-bytes: ${GATEWAY_PROMPT_LOG_MAX_BYTES:65536}
  alerts:
    webhook-url: ${GATEWAY_ALERT_WEBHOOK:}
    cooldown: ${GATEWAY_ALERT_COOLDOWN:1h}
    budget-threshold: ${GATEWAY_ALERT_BUDGET_THRESHOLD:0.8}
  usage-retention: ${GATEWAY_USAGE_RETENTION:180d}
  idempotency:
    ttl: ${GATEWAY_IDEMPOTENCY_TTL:24h}
    pending-timeout: ${GATEWAY_IDEMPOTENCY_PENDING:2m}
    max-response-bytes: ${GATEWAY_IDEMPOTENCY_MAX_BYTES:2097152}
  # Upstream credentials. A key stored through the admin API takes precedence.
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    groq:
      api-key: ${GROQ_API_KEY:}
    gemini:
      api-key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: ${GATEWAY_TRACE_SAMPLE:0}

springdoc:
  api-docs:
    enabled: ${GATEWAY_API_DOCS:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${GATEWAY_SWAGGER_UI:false}
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.anindra.path: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n"
